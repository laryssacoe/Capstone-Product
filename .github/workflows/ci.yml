name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run backend tests
        run: npm run test:backend

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run visual Playwright tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loop_ci?connect_timeout=1
          # Use mocked API responses so visual CI does not require a live/seeding DB.
          VISUAL_MOCK_API: "1"
        run: npm run test:visual:core-fast

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: playwright-report-visual
          if-no-files-found: ignore
